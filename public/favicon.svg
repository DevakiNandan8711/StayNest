<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient in StayNest Signature Coral -->
    <linearGradient id="sn-brand-bg" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FF5A60" />
      <stop offset="50%" stop-color="#FE424D" />
      <stop offset="100%" stop-color="#CF1928" />
    </linearGradient>

    <!-- Subtle Glaze for Modern App Feel -->
    <linearGradient id="sn-glaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="sn-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#800612" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Canvas (High-contrast visibility in Dark & Light tab bars) -->
  <rect width="512" height="512" rx="120" fill="url(#sn-brand-bg)" />
  <rect width="512" height="512" rx="120" fill="url(#sn-glaze)" />
  <rect x="3" y="3" width="506" height="506" rx="117" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4" />

  <!-- StayNest Modern Vacation Villa Emblem -->
  <g filter="url(#sn-shadow)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof with generous eaves overhang -->
    <path d="M 112 214 L 256 98 L 400 214" stroke-width="38" />

    <!-- Cottage Chimney -->
    <path d="M 334 135 V 170" stroke-width="26" />

    <!-- House Body Walls & Foundation -->
    <path d="M 152 214 V 392 H 360 V 214" stroke-width="34" />

    <!-- Welcoming Arched Front Door -->
    <path d="M 218 392 V 304 C 218 282 235 266 256 266 C 277 266 294 282 294 304 V 392" stroke-width="28" />

    <!-- Cozy Attic Porthole Window -->
    <circle cx="256" cy="192" r="18" fill="#FFFFFF" stroke="none" />
  </g>
</svg>